<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Native iOS 27 Dark Obsidian-Slate Canvas -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222a3a" />
      <stop offset="50%" stop-color="#141b29" />
      <stop offset="100%" stop-color="#0b101b" />
    </linearGradient>

    <!-- Back Cobalt Glass Layer -->
    <linearGradient id="cobaltGlassBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6085c8" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#34569c" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#1e366e" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="cobaltGlassDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b4885" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#172952" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="cobaltSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.20" />
    </linearGradient>

    <!-- Front Frosted Ice-White Liquid Glass Card -->
    <linearGradient id="frontIceGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef5ff" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#bfd4f2" stop-opacity="0.84" />
      <stop offset="100%" stop-color="#89aad9" stop-opacity="0.82" />
    </linearGradient>

    <linearGradient id="frontSpecularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45" />
    </linearGradient>

    <!-- Status Dots (Sky Blue, Amber, Emerald) -->
    <radialGradient id="dotBlue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <radialGradient id="dotAmber" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <radialGradient id="dotEmerald" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- Frosted Pill Bars -->
    <linearGradient id="pillBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.42" />
    </linearGradient>

    <filter id="layerShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050914" flood-opacity="0.48" />
    </filter>

    <filter id="itemShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1e3a8a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. Full-Bleed Canvas -->
  <rect width="512" height="512" fill="url(#bgCanvas)" />

  <!-- 2. Bottom-Right Recessed Cobalt Glass Card -->
  <rect x="138" y="138" width="286" height="286" rx="64" fill="url(#cobaltGlassDeep)" stroke="url(#cobaltSpecular)" stroke-width="2.5" filter="url(#layerShadow)" />

  <!-- 3. Top-Left Recessed Cobalt Glass Card -->
  <rect x="88" y="88" width="286" height="286" rx="64" fill="url(#cobaltGlassBack)" stroke="url(#cobaltSpecular)" stroke-width="3" filter="url(#layerShadow)" />

  <!-- 4. Primary Front Frosted Liquid Glass Card -->
  <g filter="url(#layerShadow)">
    <rect x="118" y="118" width="276" height="276" rx="62" fill="url(#frontIceGlass)" stroke="url(#frontSpecularRim)" stroke-width="3.5" />

    <!-- Row 1: Sky Blue Glass Indicator + Frosted Bar -->
    <g filter="url(#itemShadow)">
      <circle cx="178" cy="190" r="22" fill="url(#dotBlue)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" />
      <rect x="220" y="177" width="134" height="26" rx="13" fill="url(#pillBar)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.8" />
    </g>

    <!-- Row 2: Warm Amber Glass Indicator + Frosted Bar -->
    <g filter="url(#itemShadow)">
      <circle cx="178" cy="256" r="22" fill="url(#dotAmber)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" />
      <rect x="220" y="243" width="134" height="26" rx="13" fill="url(#pillBar)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.8" />
    </g>

    <!-- Row 3: Emerald Green Glass Indicator + Frosted Bar -->
    <g filter="url(#itemShadow)">
      <circle cx="178" cy="322" r="22" fill="url(#dotEmerald)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" />
      <rect x="220" y="309" width="134" height="26" rx="13" fill="url(#pillBar)" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.8" />
    </g>
  </g>
</svg>
