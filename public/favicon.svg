<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Full-Bleed Sapphire-Slate Liquid Glass Surface -->
    <linearGradient id="bgSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3b68" />
      <stop offset="50%" stop-color="#1a345c" />
      <stop offset="100%" stop-color="#14294a" />
    </linearGradient>

    <!-- Sky Blue Glass Orb -->
    <radialGradient id="orbBlue" cx="42%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <!-- Amber Gold Glass Orb -->
    <radialGradient id="orbAmber" cx="42%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Emerald Green Glass Orb -->
    <radialGradient id="orbEmerald" cx="42%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- Frosted Ice-White Capsule Bar -->
    <linearGradient id="frostBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#bfdbfe" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="barRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.55" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#091528" flood-opacity="0.42" />
    </filter>
  </defs>

  <!-- 100% Full-Bleed Surface (iOS applies its own squircle mask) -->
  <rect width="512" height="512" fill="url(#bgSurface)" />

  <!-- Row 1: Sky Blue Glass Orb + Frosted Capsule -->
  <g filter="url(#softGlow)">
    <circle cx="104" cy="106" r="52" fill="url(#orbBlue)" stroke="#bae6fd" stroke-width="3" />
    <ellipse cx="104" cy="84" rx="32" ry="18" fill="#ffffff" fill-opacity="0.32" />
    <rect x="180" y="60" width="280" height="92" rx="46" fill="url(#frostBar)" stroke="url(#barRim)" stroke-width="3" />
  </g>

  <!-- Row 2: Amber Gold Glass Orb + Frosted Capsule -->
  <g filter="url(#softGlow)">
    <circle cx="104" cy="256" r="52" fill="url(#orbAmber)" stroke="#fde68a" stroke-width="3" />
    <ellipse cx="104" cy="234" rx="32" ry="18" fill="#ffffff" fill-opacity="0.32" />
    <rect x="180" y="210" width="280" height="92" rx="46" fill="url(#frostBar)" stroke="url(#barRim)" stroke-width="3" />
  </g>

  <!-- Row 3: Emerald Green Glass Orb with Checkmark + Frosted Capsule -->
  <g filter="url(#softGlow)">
    <circle cx="104" cy="406" r="52" fill="url(#orbEmerald)" stroke="#86efac" stroke-width="3" />
    <ellipse cx="104" cy="384" rx="32" ry="18" fill="#ffffff" fill-opacity="0.28" />
    <path d="M84 408 L98 422 L124 386" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="180" y="360" width="280" height="92" rx="46" fill="url(#frostBar)" stroke="url(#barRim)" stroke-width="3" />
  </g>
</svg>
