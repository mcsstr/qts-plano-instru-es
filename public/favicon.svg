<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo Arredondado estilo iOS / Android Premium -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Brilho sutil superior -->
  <path d="M 0 116 Q 256 40 512 116 L 512 0 L 0 0 Z" fill="#ffffff" opacity="0.08" />

  <!-- Moldura de Escudo / Emblema Sutil ao Fundo -->
  <path d="M256 56 L416 112 L416 252 C416 356 346 432 256 468 C166 432 96 356 96 252 L96 112 Z" 
        fill="#0f172a" opacity="0.18" />
  <path d="M256 66 L404 118 L404 250 C404 346 339 418 256 452 C173 418 108 346 108 250 L108 118 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.65" />

  <!-- Corpo Principal do Calendário -->
  <g filter="url(#shadow)">
    <rect x="116" y="118" width="280" height="260" rx="36" fill="url(#cardGrad)" />
    <!-- Topo do Calendário -->
    <path d="M 116 154 C 116 134 132 118 152 118 L 360 118 C 380 118 396 134 396 154 L 396 186 L 116 186 Z" fill="#1d4ed8" />
    
    <!-- Argolas Superiores Douradas -->
    <rect x="176" y="96" width="22" height="44" rx="11" fill="url(#goldGrad)" />
    <rect x="314" y="96" width="22" height="44" rx="11" fill="url(#goldGrad)" />

    <!--Texto QTS no cabeçalho do calendário -->
    <text x="256" y="167" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">QTS</text>

    <!-- Grade de Aulas / Blocos Coloridos -->
    <rect x="144" y="210" width="60" height="42" rx="10" fill="#3b82f6" opacity="0.9" />
    <rect x="226" y="210" width="60" height="42" rx="10" fill="#6366f1" opacity="0.9" />
    <rect x="308" y="210" width="60" height="42" rx="10" fill="#10b981" opacity="0.9" />

    <rect x="144" y="268" width="60" height="42" rx="10" fill="#f59e0b" opacity="0.9" />
    <rect x="226" y="268" width="60" height="42" rx="10" fill="#2563eb" />
    <!-- Checkmark no bloco central -->
    <path d="M246 289 L253 296 L268 281" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="308" y="268" width="60" height="42" rx="10" fill="#8b5cf6" opacity="0.9" />

    <!-- Faixa Inferior FT -->
    <rect x="144" y="324" width="224" height="34" rx="10" fill="#1e293b" />
    <text x="256" y="348" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="6">FORÇA TÁTICA</text>
  </g>

  <!-- Estrela Dourada no Rodapé do Escudo -->
  <polygon points="256,402 263,417 280,419 267,430 271,446 256,438 241,446 245,430 232,419 249,417" fill="url(#goldGrad)" />
</svg>
